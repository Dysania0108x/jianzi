[package]
name = "jianzi"
version = "0.1.0"
description = "见字 · 私人文字空间"
authors = ["Jianzi"]
edition = "2021"

[lib]
name = "jianzi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
